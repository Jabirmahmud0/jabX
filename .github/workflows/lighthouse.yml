name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build Next.js project
        run: npm run build
        env:
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: CI_STUB
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: CI_STUB
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: CI_STUB
          NEXT_PUBLIC_GA_ID: CI_STUB
          
      - name: Run Lighthouse CI
        run: npx @lhci/cli autorun
        env:
          LHCI_OUTPUT_DIR: ./lhci_reports
          LHCI_BUILD_CONTEXT__BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: CI_STUB
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: CI_STUB
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: CI_STUB
          NEXT_PUBLIC_GA_ID: CI_STUB
